plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'app.cash.paparazzi' version '1.3.3'
}

// ---------------------------------------------------------------------------------------------
// Signing
//
// Android only accepts an update when the new APK is signed with the SAME key as the installed
// one. Previously CI builds fell back to the runner's auto-generated debug key, which is
// different on every GitHub Actions run, so every new release failed to install over the old one
// ("App not installed" / "package conflicts with an existing package").
//
// Release signing key resolution order:
//   1. Environment variables (used by CI, fed from GitHub secrets):
//        RELEASE_KEYSTORE_FILE, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
//   2. keystore.properties in the project root (local builds with keystore/release.jks)
//   3. keystore/stable-signing.p12 committed to the repo – a fixed key, so builds are always
//      signed identically and updates install cleanly even without secrets configured.
// Debug builds always use the committed stable key so they can update each other too.
// ---------------------------------------------------------------------------------------------
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def stableKeystoreFile = rootProject.file('keystore/stable-signing.p12')
def stableKeystorePassword = 'nothinglauncher'
def stableKeyAlias = 'nothinglauncher'

def envKeystorePath = System.getenv('RELEASE_KEYSTORE_FILE')
def hasEnvKeystore = envKeystorePath != null && !envKeystorePath.trim().isEmpty() && file(envKeystorePath).exists()

// versionCode must increase with every build so Android treats it as an update:
//   VERSION_CODE env (explicit override) > 2000 + GITHUB_RUN_NUMBER (set automatically by
//   GitHub Actions, so every CI build installs over the previous one) > 2000 for local builds.
//   The 2000 offset keeps every build newer than all pre-11.0 releases. See docs/RELEASING.md.
def envInt = { String name -> def v = System.getenv(name); (v != null && v.trim().isInteger()) ? v.trim().toInteger() : null }
def resolvedVersionCode = envInt('VERSION_CODE') ?: (envInt('GITHUB_RUN_NUMBER') != null ? 2000 + envInt('GITHUB_RUN_NUMBER') : 2000)

android {
    namespace 'com.nothinglauncher'
    // compileSdk can't go to 36 yet: the vendored Launcher3 (android-14) resources reference
    // android:attr/materialColor* (e.g. materialColorOnSurface), which the API 35 SDK exposes
    // but the API 36 SDK no longer does, so aapt2 fails to link them. targetSdk is independent
    // of that (it only selects runtime behaviour), see below.
    compileSdk 35

    defaultConfig {
        applicationId "com.nothinglauncher"
        minSdk 26
        // Android 16 (API 36), the level Google Play requires since Aug 2026. What changes for
        // an app targeting 36, and why each is already handled here:
        //  - predictive back on by default, onBackPressed()/KEYCODE_BACK no longer delivered:
        //    Launcher3's BaseActivity registers an OnBackInvokedCallback that calls
        //    Launcher.onBackPressed(); NothingSettingsActivity uses AndroidX's dispatcher.
        //  - edge-to-edge opt-out removed: nothing opts out; NothingSettingsActivity applies
        //    system-bar and cutout insets on all four sides.
        //  - orientation/resizability ignored on sw600dp: the home activity is already
        //    resizeable with screenOrientation="unspecified"; Launcher3 rotates on tablets.
        targetSdk 36
        versionCode resolvedVersionCode
        versionName "12"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        stable {
            storeFile stableKeystoreFile
            storePassword stableKeystorePassword
            keyAlias stableKeyAlias
            keyPassword stableKeystorePassword
            storeType 'pkcs12'
        }
        release {
            if (hasEnvKeystore) {
                storeFile file(envKeystorePath)
                storePassword System.getenv('RELEASE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_KEY_PASSWORD') ?: System.getenv('RELEASE_KEYSTORE_PASSWORD')
            } else if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            } else {
                storeFile stableKeystoreFile
                storePassword stableKeystorePassword
                keyAlias stableKeyAlias
                keyPassword stableKeystorePassword
                storeType 'pkcs12'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.stable
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    sourceSets {
        main {
            // Generated by tools/gen_nothing_theme.py: Launcher3's Material You palette replaced
            // by the fixed Not a Thing palette (monochrome + Nothing red).
            res.srcDirs += 'src/main/res-launcher3-theme'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    lint {
        // Launcher3 is vendored AOSP code; its own lint baseline is not part of this build.
        checkDependencies false
        abortOnError false
        // The base (unqualified) values of overridden Launcher3 resources live in :launcher3.
        disable 'MissingDefaultResource'

    }
}

dependencies {
    // Stock AOSP Launcher3: home screen, all apps, folders, widgets, drag & drop, settings.
    implementation project(':launcher3')

    testImplementation 'junit:junit:4.13.2'
    // Runs the real launcher (Launcher3 + Not a Thing) on the JVM and records its logcat.
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test:core-ktx:1.5.0'
}

// Paparazzi (layoutlib) needs the JVM flavour of Guava on the unit-test classpath.
// Guava 31.1-jre ships without Gradle variant metadata, so the Android flavour is never selected.
configurations.configureEach { config ->
    if (config.name.contains('UnitTest')) {
        config.resolutionStrategy.force 'com.google.guava:guava:31.1-jre'
    }
}

tasks.withType(Test).configureEach {
    // Paparazzi/layoutlib read the SDK location from the environment; fall back to the one AGP
    // resolved (local.properties sdk.dir) when neither variable is set.
    def sdkDir = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT') ?: android.sdkDirectory.path
    environment 'ANDROID_HOME', sdkDir
    environment 'ANDROID_SDK_ROOT', sdkDir
}

// ---------------------------------------------------------------------------------------------
// Release reflection check (tools/verify_release_reflection.py)
//
// Launcher3 instantiates custom widgets and ResourceBasedOverride classes purely by name from
// resources, which R8 can't see; debug builds aren't minified, so no test notices if a keep rule
// lets R8 strip one (11.1 shipped a release build with every Not a Thing widget missing). This
// runs automatically at the end of every assembleRelease — locally and in CI, whose existing
// "./gradlew assembleRelease" step picks it up without any change to .github/workflows (agent
// sessions can't push workflow-file changes; see AGENTS.md).
//
// Needs Python 3. If none is found, CI (env CI=true) fails; a local build only warns.
// ---------------------------------------------------------------------------------------------
def findPython = {
    for (cmd in ['python3', 'python', 'py']) {
        try {
            def p = [cmd, '-c', 'import sys; sys.exit(0 if sys.version_info[0] == 3 else 1)'].execute()
            p.waitFor()
            if (p.exitValue() == 0) return cmd
        } catch (IOException ignored) {
        }
    }
    return null
}

def verifyReleaseReflection = tasks.register('verifyReleaseReflection') {
    group = 'verification'
    description = 'Fails if R8 stripped a class Launcher3 loads by name (custom widgets, ResourceBasedOverride).'
    dependsOn 'packageRelease'
    doLast {
        def python = findPython()
        if (python == null) {
            def msg = 'verifyReleaseReflection: Python 3 not found, so the release build was NOT checked ' +
                    'for classes R8 may have stripped (see tools/verify_release_reflection.py).'
            if (System.getenv('CI') == 'true') throw new GradleException(msg)
            logger.warn('WARNING: ' + msg)
            return
        }
        def apkDir = layout.buildDirectory.dir('outputs/apk/release').get().asFile
        def apks = (apkDir.listFiles() ?: []).findAll { it.name.endsWith('.apk') }
        if (apks.size() != 1) throw new GradleException("verifyReleaseReflection: expected one release APK in $apkDir, found ${apks*.name}")
        def root = rootProject.projectDir
        project.exec {
            commandLine python, new File(root, 'tools/verify_release_reflection.py').path,
                    '--apk', apks[0].path,
                    '--values', layout.buildDirectory.file('intermediates/incremental/release/mergeReleaseResources/merged.dir/values/values.xml').get().asFile.path,
                    '--sources', new File(root, 'third_party/aosp/launcher3/src').path,
                    new File(root, 'launcher3/src').path, file('src/main/java').path
        }
    }
}

tasks.matching { it.name == 'assembleRelease' }.configureEach {
    finalizedBy verifyReleaseReflection
}
