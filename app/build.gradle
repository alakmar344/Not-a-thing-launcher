plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'app.cash.paparazzi' version '1.3.3'
}

// ---------------------------------------------------------------------------------------------
// Signing
//
// Android only accepts an update when the new APK is signed with the SAME key as the installed
// one. Previously CI builds fell back to the runner's auto-generated debug key, which is
// different on every GitHub Actions run, so every new release failed to install over the old one
// ("App not installed" / "package conflicts with an existing package").
//
// Release signing key resolution order:
//   1. Environment variables (used by CI, fed from GitHub secrets):
//        RELEASE_KEYSTORE_FILE, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
//   2. keystore.properties in the project root (local builds with keystore/release.jks)
//   3. keystore/stable-signing.p12 committed to the repo – a fixed key, so builds are always
//      signed identically and updates install cleanly even without secrets configured.
// Debug builds always use the committed stable key so they can update each other too.
// ---------------------------------------------------------------------------------------------
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def stableKeystoreFile = rootProject.file('keystore/stable-signing.p12')
def stableKeystorePassword = 'nothinglauncher'
def stableKeyAlias = 'nothinglauncher'

def envKeystorePath = System.getenv('RELEASE_KEYSTORE_FILE')
def hasEnvKeystore = envKeystorePath != null && !envKeystorePath.trim().isEmpty() && file(envKeystorePath).exists()

// versionCode must increase with every build so Android treats it as an update.
//   VERSION_CODE env (explicit override) > 2000 + GITHUB_RUN_NUMBER (set automatically by
//   GitHub Actions) > 2000 for local builds. Rebuilt historical releases use 1001..1011
//   (see ci/workflows/rebuild-old-releases.yml), so every current build is newer than them.
def envInt = { String name -> def v = System.getenv(name); (v != null && v.trim().isInteger()) ? v.trim().toInteger() : null }
def resolvedVersionCode = envInt('VERSION_CODE') ?: (envInt('GITHUB_RUN_NUMBER') != null ? 2000 + envInt('GITHUB_RUN_NUMBER') : 2000)

android {
    namespace 'com.nothinglauncher'
    compileSdk 34

    defaultConfig {
        applicationId "com.nothinglauncher"
        minSdk 26
        targetSdk 34
        versionCode resolvedVersionCode
        versionName "10.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        stable {
            storeFile stableKeystoreFile
            storePassword stableKeystorePassword
            keyAlias stableKeyAlias
            keyPassword stableKeystorePassword
            storeType 'pkcs12'
        }
        release {
            if (hasEnvKeystore) {
                storeFile file(envKeystorePath)
                storePassword System.getenv('RELEASE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_KEY_PASSWORD') ?: System.getenv('RELEASE_KEYSTORE_PASSWORD')
            } else if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            } else {
                storeFile stableKeystoreFile
                storePassword stableKeystorePassword
                keyAlias stableKeyAlias
                keyPassword stableKeystorePassword
                storeType 'pkcs12'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.stable
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    lint {
        // android:tint is fully supported on ImageView from API 21; minSdk is 26.
        disable 'UseAppTint'
        // Launcher is intentionally portrait-only, like the system launcher.
        disable 'LockedOrientationActivity'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test:core-ktx:1.5.0'
}

// Paparazzi (layoutlib) needs the JVM flavour of Guava on the unit-test classpath.
// Guava 31.1-jre ships without Gradle variant metadata, so the Android flavour is never selected.
configurations.configureEach { config ->
    if (config.name.contains('UnitTest')) {
        config.resolutionStrategy.force 'com.google.guava:guava:31.1-jre'
    }
}

tasks.withType(Test).configureEach {
    def sdkDir = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT') ?: 'C:/Users/proma/android-sdk'
    environment 'ANDROID_HOME', sdkDir
    environment 'ANDROID_SDK_ROOT', sdkDir
}
