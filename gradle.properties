# R8 over Launcher3 needs more than the 2 GB default (GitHub runners have 16 GB).
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=false
kotlin.code.style=official
# Launcher3 references resources of iconloader/animationlib through its own R class (as in AOSP).
android.nonTransitiveRClass=false
# Build-time only (no effect on the shipped APK): run independent modules/tasks concurrently and
# reuse cached task outputs across builds, so local assembleDebug/assembleRelease and CI both get
# faster incremental builds on multi-core runners.
org.gradle.parallel=true
org.gradle.caching=true
# AGP 8 already defaults R8 to full mode (dead-code elimination across the whole app, aggressive
# inlining/repackaging) for minifyEnabled release builds; stated explicitly here so it can't
# silently regress to the slower/larger "legacy" mode on a future AGP upgrade.
android.enableR8.fullMode=true
