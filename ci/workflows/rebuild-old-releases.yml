name: Rebuild old releases with unified signing

# Run manually (Actions tab -> "Rebuild old releases with unified signing" -> Run workflow).
# Re-signs every historical release with the SAME key as current builds and gives each one an
# increasing versionCode, then replaces the APK/AAB assets on each GitHub release. After this a new
# user can install ANY version and update to any newer one without uninstalling.
#
# v10.0 is not listed: it is rebuilt by the normal build workflow on every push to main
# (versionCode 2000+run number, newer than everything here).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { tag: v2,   code: 1001 }
          - { tag: v3,   code: 1002 }
          - { tag: v4,   code: 1003 }
          - { tag: v5,   code: 1004 }
          - { tag: v6,   code: 1005 }
          - { tag: v7,   code: 1006 }
          - { tag: v10,  code: 1006 } # tag v10 points at the same commit as v7
          - { tag: v7.5, code: 1007 }
          - { tag: v7.6, code: 1008 }
          - { tag: v8,   code: 1009 }
          - { tag: V9,   code: 1010 }
          - { tag: v9.0, code: 1011 }
    steps:
      - name: Checkout tools from default branch
        uses: actions/checkout@v4
        with:
          path: tools

      - name: Checkout ${{ matrix.tag }}
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ matrix.tag }}
          path: src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode release keystore (optional)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APKs and AAB
        working-directory: src
        env:
          STABLE_KEYSTORE_FILE: ${{ github.workspace }}/tools/keystore/stable-signing.p12
          FORCE_VERSION_CODE: ${{ matrix.code }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --init-script "$GITHUB_WORKSPACE/tools/ci/unified-signing.init.gradle" \
            assembleDebug assembleRelease bundleRelease -x lint --console=plain

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Replace release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ matrix.tag }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Release $TAG" --notes "Rebuilt with unified signing."
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber \
            src/app/build/outputs/apk/debug/*.apk \
            src/app/build/outputs/apk/release/*.apk \
            src/app/build/outputs/bundle/release/*.aab
