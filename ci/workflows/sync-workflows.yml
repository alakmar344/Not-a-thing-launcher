name: Sync staged workflows

# Mirrors ci/workflows/*.yml into .github/workflows/ after changes land on main.
#
# Why: the automation that pushes agent branches isn't allowed to change .github/workflows/, so
# workflow changes are staged in ci/workflows/ instead. This job makes them live once they're
# merged — the PR review that merges them is the human check GitHub's restriction exists for.
#
# Needs a repository secret WORKFLOW_SYNC_TOKEN: the built-in GITHUB_TOKEN can never be granted
# permission to modify workflow files. Use a fine-grained personal access token scoped to this
# repository with "Contents: Read and write" and "Workflows: Read and write" (or a classic token
# with the `repo` and `workflow` scopes). See README, "Staged workflows".
#
# This file is itself mirrored, so changes to it in ci/workflows/ apply on the next run.

on:
  push:
    branches: [ main ]
    paths:
      - 'ci/workflows/**'
      - '.github/workflows/sync-workflows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-workflows
  cancel-in-progress: false

jobs:
  sync:
    # Never on forks, never from anything but main.
    if: github.repository == 'alakmar344/Not-a-thing-launcher' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check token
        env:
          WORKFLOW_SYNC_TOKEN: ${{ secrets.WORKFLOW_SYNC_TOKEN }}
        run: |
          if [ -z "$WORKFLOW_SYNC_TOKEN" ]; then
            echo "::error::Secret WORKFLOW_SYNC_TOKEN is not set, so ci/workflows/ can't be mirrored into .github/workflows/. See README, 'Staged workflows'."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_SYNC_TOKEN }}

      - name: Mirror ci/workflows into .github/workflows
        run: |
          set -euo pipefail
          shopt -s nullglob
          staged=(ci/workflows/*.yml ci/workflows/*.yaml)
          if [ ${#staged[@]} -eq 0 ]; then echo "Nothing staged."; exit 0; fi
          mkdir -p .github/workflows
          for f in "${staged[@]}"; do
            cp "$f" ".github/workflows/$(basename "$f")"
          done
          git add .github/workflows
          if git diff --cached --quiet; then
            echo "Live workflows already match ci/workflows/."
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync .github/workflows from ci/workflows" \
                     -m "Mirrored by .github/workflows/sync-workflows.yml from $GITHUB_SHA."
          git push origin HEAD:main
