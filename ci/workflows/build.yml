name: Build and Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      rebuild_old_releases:
        description: 'Also re-sign and rebuild all old releases (v2 - v9.0) with the same key'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      
      # Strictly increasing versionCode for every CI build so each release installs as an update.
      - name: Set versionCode
        run: echo "VERSION_CODE=$(( ${{ github.run_number }} + 2000 ))" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Run Paparazzi Screenshot Tests
        run: ./gradlew recordPaparazziDebug
      
      - name: Upload Paparazzi Screenshots
        uses: actions/upload-artifact@v4
        with:
          name: NothingLauncher-screenshots
          path: app/src/test/snapshots/images/*.png

      # Optional: sign releases with your own key. Add these repository secrets:
      #   RELEASE_KEYSTORE_BASE64  (base64 of keystore/release.jks)
      #   RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
      # Without them the committed keystore/stable-signing.p12 is used. Either way the key is the
      # same on every run, so new releases install over old ones without uninstalling.
      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using release keystore from secrets"
          else
            echo "No RELEASE_KEYSTORE_BASE64 secret; using committed stable signing key"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug
      
      - name: Build Release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Build Release AAB
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NothingLauncher-debug
          path: app/build/outputs/apk/debug/*.apk
      
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NothingLauncher-release
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: NothingLauncher-release-aab
          path: app/build/outputs/bundle/release/*.aab
      
      - name: Create Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v10.1' }}
          name: Release ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v10.1' }}
          overwrite_files: true
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/src/test/snapshots/images/*.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rebuild-old-releases:
    # Only when started manually: Actions -> Build and Release APK -> Run workflow -> tick the box
    if: github.event_name == 'workflow_dispatch' && inputs.rebuild_old_releases
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { tag: v2,   code: 1001 }
          - { tag: v3,   code: 1002 }
          - { tag: v4,   code: 1003 }
          - { tag: v5,   code: 1004 }
          - { tag: v6,   code: 1005 }
          - { tag: v7,   code: 1006 }
          - { tag: v10,  code: 1006 } # tag v10 points at the same commit as v7
          - { tag: v7.5, code: 1007 }
          - { tag: v7.6, code: 1008 }
          - { tag: v8,   code: 1009 }
          - { tag: V9,   code: 1010 }
          - { tag: v9.0, code: 1011 }
    steps:
      - name: Checkout tools from default branch
        uses: actions/checkout@v4
        with:
          path: tools

      - name: Checkout ${{ matrix.tag }}
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ matrix.tag }}
          path: src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode release keystore (optional)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APKs and AAB
        working-directory: src
        env:
          STABLE_KEYSTORE_FILE: ${{ github.workspace }}/tools/keystore/stable-signing.p12
          FORCE_VERSION_CODE: ${{ matrix.code }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --init-script "$GITHUB_WORKSPACE/tools/ci/unified-signing.init.gradle" \
            assembleDebug assembleRelease bundleRelease -x lint --console=plain

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Replace release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ matrix.tag }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Release $TAG" --notes "Rebuilt with unified signing."
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber \
            src/app/build/outputs/apk/debug/*.apk \
            src/app/build/outputs/apk/release/*.apk \
            src/app/build/outputs/bundle/release/*.aab
