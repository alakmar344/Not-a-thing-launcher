name: Build and Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read versionName
        id: version
        run: |
          name=$(sed -n 's/^ *versionName "\(.*\)"/\1/p' app/build.gradle | head -n 1)

          if [[ -z "$name" ]]; then
            echo "::error::Could not read versionName from app/build.gradle"
            exit 1
          fi

          tag="v${name}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${tag}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match versionName ${name}. Expected ${tag}"
            exit 1
          fi

          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          echo "Detected version: ${tag}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run Paparazzi Screenshot Tests
        run: ./gradlew recordPaparazziDebug

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Upload Paparazzi Screenshots
        uses: actions/upload-artifact@v4
        with:
          name: NotAThingLauncher-screenshots
          path: app/src/test/snapshots/images/*.png

      - name: Configure Release Signing Keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          if [[ -n "${KEYSTORE_B64}" && -n "${KEYSTORE_PW}" && -n "${KEY_ALIAS}" ]]; then
            printf '%s' "${KEYSTORE_B64}" | tr -d '\r\n' | base64 -d > "${RUNNER_TEMP}/release.p12"
            chmod 600 "${RUNNER_TEMP}/release.p12"
            echo "RELEASE_KEYSTORE_FILE=${RUNNER_TEMP}/release.p12" >> "$GITHUB_ENV"
          elif [[ "${GITHUB_EVENT_NAME}" != "pull_request" || "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]]; then
            echo "::error::Missing RELEASE_KEYSTORE_* GitHub Actions secrets for release signing."
            exit 1
          else
            echo "::warning::Fork PR without secrets; release build uses debug signing for R8 verification."
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NotAThingLauncher-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NotAThingLauncher-release
          path: app/build/outputs/apk/release/*.apk

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/src/test/snapshots/images/*.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
